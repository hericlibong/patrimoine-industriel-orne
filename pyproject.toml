[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patrimoine-industriel-orne"
version = "0.1.0"
description = "Socle de données du projet datajournalistique sur le patrimoine industriel de l'Orne"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
  "geopandas",
  "pandas",
  "pyarrow",
  "pyyaml",
  "rapidfuzz",
  "requests",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patrimoine_orne = ["model/*.sql"]

[project.scripts]
patrimoine-orne-db = "patrimoine_orne.model.database:main"
patrimoine-orne-audit-secteurs = "patrimoine_orne.classify.sectors:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
