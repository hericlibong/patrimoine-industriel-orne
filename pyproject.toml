[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patrimoine-industriel-orne"
version = "0.1.0"
description = "Socle de données du projet datajournalistique sur le patrimoine industriel de l'Orne"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4,<2",
  "geopandas",
  "pandas",
  "pyarrow",
  "pyproj",
  "pyyaml",
  "rapidfuzz",
  "requests",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patrimoine_orne = ["model/*.sql"]

[project.scripts]
patrimoine-orne-db = "patrimoine_orne.model.database:main"
patrimoine-orne-audit-secteurs = "patrimoine_orne.classify.sectors:main"
patrimoine-orne-audit-situation = "patrimoine_orne.classify.current_state:main"
patrimoine-orne-audit-qualite = "patrimoine_orne.classify.quality:main"
patrimoine-orne-controle-echantillon = "patrimoine_orne.sample.pilot:main"
patrimoine-orne-extraire-pilote = "patrimoine_orne.extract.pilot:main"
patrimoine-orne-extraire-objets-pilote = "patrimoine_orne.extract.pilot_objects:main"
patrimoine-orne-enrichir-pilote = "patrimoine_orne.enrich.pilot:main"
patrimoine-orne-extraire-communes = "patrimoine_orne.extract.current_communes:main"
patrimoine-orne-valider-phase5 = "patrimoine_orne.validate.pilot_phase5:main"
patrimoine-orne-extraire-geographie-pilote = "patrimoine_orne.extract.pilot_geography:main"
patrimoine-orne-qualifier-geographie-pilote = "patrimoine_orne.geocode.pilot:main"
patrimoine-orne-extraire-contexte-territorial = "patrimoine_orne.extract.territorial_context:main"
patrimoine-orne-calculer-contexte-territorial = "patrimoine_orne.geocode.territorial_context:main"
patrimoine-orne-controle-cartographique = "patrimoine_orne.geocode.cartographic_control:main"
patrimoine-orne-produire-socle-v1 = "patrimoine_orne.export.socle_v1:main"
patrimoine-orne-preparer-phase8-lot1 = "patrimoine_orne.extract.corpus:main"
patrimoine-orne-reunir-corpus-80 = "patrimoine_orne.transform.corpus_80:main"
patrimoine-orne-extraire-reste-phase8 = "patrimoine_orne.extract.remaining:main"
patrimoine-orne-reunir-corpus-319 = "patrimoine_orne.transform.corpus_319:main"
patrimoine-orne-canoniser-phase8 = "patrimoine_orne.transform.canonical:main"
patrimoine-orne-extraire-enrichissement-complet = "patrimoine_orne.extract.full_enrichment:main"
patrimoine-orne-enrichir-corpus-complet = "patrimoine_orne.enrich.full_corpus:main"
patrimoine-orne-extraire-contexte-complet = "patrimoine_orne.extract.full_territorial_context:main"
patrimoine-orne-calculer-contexte-complet = "patrimoine_orne.geocode.full_territorial_context:main"
patrimoine-orne-produire-corpus-complet-v1 = "patrimoine_orne.export.corpus_complet_v1:main"
patrimoine-orne-produire-recits-v1 = "patrimoine_orne.export.editorial_v1:main"
patrimoine-orne-produire-medias-v1 = "patrimoine_orne.export.medias_v1:main"
patrimoine-orne-qualifier-medias-v1 = "patrimoine_orne.export.qualifier_medias_v1:main"
patrimoine-orne-revue-editoriale-v1 = "patrimoine_orne.export.revue_editoriale_v1:main"
patrimoine-orne-valider-narratif-visuel-v1 = "patrimoine_orne.export.validate_narratif_visuel_v1:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
