<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-label="Nouvelle maquette de la rubrique Les lieux expliquant le paysage, l'évolution et le statut de l'usine Abadie">
  <defs>
    <linearGradient id="image-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#102D27" stop-opacity="0.86"/>
      <stop offset="0.5" stop-color="#102D27" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#102D27" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="1100" fill="#FCFAF5"/>
  <rect width="1440" height="70" fill="#173F35"/>
  <g font-family="Inter, Arial, sans-serif" fill="#FCFAF5">
    <text x="42" y="44" font-size="16" font-weight="760" letter-spacing="0.8">PATRIMOINE INDUSTRIEL OUBLIÉ</text>
    <g font-size="14" font-weight="650">
      <text x="830" y="44">Le récit</text>
      <text x="918" y="44">Explorer</text>
      <rect x="1005" y="13" width="110" height="44" rx="22" fill="#C94333"/>
      <text x="1030" y="42">Les lieux</text>
      <text x="1147" y="44">Méthode</text>
    </g>
  </g>

  <image href="reference_abadie_vue_aerienne.jpg" x="0" y="70" width="1440" height="590" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="70" width="1440" height="590" fill="url(#image-shade)"/>

  <g transform="translate(62 123)">
    <text font-family="Inter, Arial, sans-serif" font-size="13" font-weight="780" letter-spacing="2" fill="#FFD166">LES LIEUX · LIRE UN PAYSAGE INDUSTRIEL</text>
    <text y="65" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#FCFAF5">L'usine Abadie</text>
    <text y="103" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="650" fill="#FCFAF5">Le Theil · usine à papier</text>
    <rect y="128" width="62" height="5" fill="#E45240"/>
    <text y="178" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic" fill="#FCFAF5">
      <tspan x="0">Que nous apprend cette image sur la place</tspan>
      <tspan x="0" dy="34">de l'usine dans son territoire ?</tspan>
    </text>
    <rect y="264" width="430" height="131" rx="16" fill="#102D27" fill-opacity="0.78"/>
    <text x="22" y="295" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="780" letter-spacing="1.3" fill="#FFD166">CE QUE L'IMAGE PERMET DE LIRE</text>
    <text x="22" y="326" font-family="Inter, Arial, sans-serif" font-size="14" fill="#FCFAF5">
      <tspan x="22">L'usine n'est pas une enclave : elle partage le cadre</tspan>
      <tspan x="22" dy="23">avec le bourg, les champs et le cours d'eau.</tspan>
      <tspan x="22" dy="23">Les sources documentent ensuite production et réseaux.</tspan>
    </text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="12" font-weight="740">
    <circle cx="865" cy="265" r="7" fill="#2F6F8F" stroke="#FCFAF5" stroke-width="3"/>
    <path d="M865 265 L972 210" stroke="#2F6F8F" stroke-width="2"/>
    <rect x="963" y="181" width="92" height="31" rx="15.5" fill="#2F6F8F"/>
    <text x="982" y="201" fill="#FFFFFF">La rivière</text>

    <circle cx="1090" cy="188" r="7" fill="#173F35" stroke="#FCFAF5" stroke-width="3"/>
    <path d="M1090 188 L1185 142" stroke="#FCFAF5" stroke-width="2"/>
    <rect x="1173" y="119" width="105" height="31" rx="15.5" fill="#FCFAF5"/>
    <text x="1193" y="139" fill="#173F35">Les champs</text>

    <circle cx="1002" cy="455" r="7" fill="#E45240" stroke="#FCFAF5" stroke-width="3"/>
    <path d="M1002 455 L1115 391" stroke="#E45240" stroke-width="2"/>
    <rect x="1105" y="363" width="82" height="31" rx="15.5" fill="#E45240"/>
    <text x="1124" y="383" fill="#FFFFFF">L'usine</text>

    <circle cx="300" cy="550" r="7" fill="#FFD166" stroke="#FCFAF5" stroke-width="3"/>
    <path d="M300 550 L430 550" stroke="#FFD166" stroke-width="2"/>
    <rect x="420" y="534" width="80" height="31" rx="15.5" fill="#FFD166"/>
    <text x="439" y="554" fill="#173F35">Le bourg</text>
  </g>

  <rect x="0" y="620" width="1440" height="40" fill="#102D27" fill-opacity="0.88"/>
  <text x="62" y="645" font-family="Inter, Arial, sans-serif" font-size="11" fill="#E3ECE7">Vue aérienne de situation · IVR25_19886100649X · Région Normandie — Inventaire général</text>
  <text x="1265" y="645" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="720" fill="#FCFAF5">Voir l'image entière</text>

  <g transform="translate(62 712)" font-family="Inter, Arial, sans-serif">
    <text font-size="12" font-weight="780" letter-spacing="1.6" fill="#C94333">ÉVOLUTION DU LIEU</text>
    <text y="52" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-weight="700" fill="#17211D">Du moulin à l'usine : un lieu transformé</text>
    <line x1="0" y1="105" x2="870" y2="105" stroke="#A3B3AC" stroke-width="4"/>
    <circle cx="0" cy="105" r="10" fill="#2F6F8F"/>
    <circle cx="213" cy="105" r="10" fill="#E45240"/>
    <circle cx="430" cy="105" r="10" fill="#FFD166"/>
    <circle cx="645" cy="105" r="10" fill="#C94333"/>
    <path d="M645 105 L870 105" stroke="#7B5B8E" stroke-width="4" stroke-dasharray="8 7"/>
    <g font-size="12" fill="#293C35">
      <text x="0" y="137" font-weight="760">1809</text><text x="0" y="156">Moulins attestés</text>
      <text x="188" y="137" font-weight="760">1866</text><text x="188" y="156">Création de l'usine</text>
      <text x="405" y="137" font-weight="760">1885</text><text x="405" y="156">Voie étroite vers Mâle</text>
      <text x="620" y="137" font-weight="760">vers 1978</text><text x="620" y="156">Cessation d'activité</text>
      <text x="793" y="83" font-weight="760" fill="#7B5B8E">Aujourd'hui</text>
      <text x="793" y="137" fill="#7B5B8E">état à documenter</text>
    </g>

    <text y="222" font-size="11" font-weight="780" letter-spacing="1.4" fill="#344841">CE QUE LES SOURCES ÉTABLISSENT</text>
    <text y="255" font-size="14" fill="#50645D">
      <tspan x="0">Production de papier, liaison ferroviaire locale, logements ouvriers,</tspan>
      <tspan x="0" dy="24">réaménagements et exportations sont documentés pour ce cas précis.</tspan>
    </text>
  </g>

  <g transform="translate(995 712)" font-family="Inter, Arial, sans-serif">
    <text font-size="12" font-weight="780" letter-spacing="1.6" fill="#173F35">STATUT DU LIEU</text>
    <rect y="28" width="383" height="278" rx="18" fill="#EEF3EF"/>
    <g transform="translate(24 52)">
      <text font-size="11" font-weight="760" fill="#61716B">ACTIVITÉ INDUSTRIELLE</text>
      <text y="24" font-size="14" font-weight="740" fill="#293C35">Cessation vers 1978</text>
      <line y1="44" x2="335" y2="44" stroke="#CFDAD4"/>
      <text y="70" font-size="11" font-weight="760" fill="#61716B">CONSERVATION MATÉRIELLE</text>
      <circle cx="6" cy="92" r="6" fill="#7B5B8E"/><text x="20" y="96" font-size="14" font-weight="740" fill="#594867">Inconnue</text>
      <line y1="116" x2="335" y2="116" stroke="#CFDAD4"/>
      <text y="142" font-size="11" font-weight="760" fill="#61716B">USAGE ACTUEL · ACCESSIBILITÉ</text>
      <circle cx="6" cy="164" r="6" fill="#7B5B8E"/><text x="20" y="168" font-size="14" font-weight="740" fill="#594867">Inconnus</text>
      <line y1="188" x2="335" y2="188" stroke="#CFDAD4"/>
      <text y="214" font-size="11" font-weight="760" fill="#61716B">LOCALISATION</text>
      <text y="238" font-size="13" font-weight="720" fill="#293C35">Point approximatif</text>
      <text x="198" y="238" font-size="12" fill="#C94333">Sources et méthode →</text>
    </g>
  </g>
</svg>
