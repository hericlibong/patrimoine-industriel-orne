<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Planche fonctionnelle de la carte exploratoire : état initial, filtres ouverts et sélection mobile">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#173F35" flood-opacity="0.16"/>
    </filter>
    <clipPath id="desktop-map"><rect x="58" y="244" width="844" height="515" rx="10"/></clipPath>
    <clipPath id="mobile-map"><rect x="1010" y="620" width="230" height="256" rx="9"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="#E7F0EA"/>
  <g font-family="Inter, Arial, sans-serif" fill="#17211D">
    <text x="42" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Exploration — états fonctionnels proposés</text>
    <text x="42" y="75" font-size="13" fill="#52645E">Une seule carte, un panneau contextuel, quatre filtres et une alternative en liste.</text>
  </g>

  <!-- Etat 1 -->
  <g filter="url(#shadow)">
    <rect x="32" y="102" width="900" height="850" rx="20" fill="#FCFAF5"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="58" y="137" font-size="11" font-weight="780" letter-spacing="1.5" fill="#C94333">ÉTAT 1 · OUVERTURE</text>
    <text x="58" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#17211D">318 sites, aucun filtre, aucun panneau</text>

    <rect x="58" y="188" width="844" height="48" rx="14" fill="#F2F5F1" stroke="#D3DED7"/>
    <circle cx="82" cy="212" r="9" fill="none" stroke="#50645D" stroke-width="2"/>
    <line x1="89" y1="219" x2="97" y2="227" stroke="#50645D" stroke-width="2"/>
    <text x="108" y="218" font-size="12" fill="#65756F">Chercher un lieu, une commune, une activité…</text>
    <line x1="340" y1="195" x2="340" y2="229" stroke="#D3DED7"/>
    <text x="361" y="208" font-size="10" font-weight="760" fill="#344841">ACTIVITÉ</text>
    <text x="361" y="224" font-size="11" fill="#66766F">Toutes</text>
    <line x1="474" y1="195" x2="474" y2="229" stroke="#D3DED7"/>
    <text x="494" y="208" font-size="10" font-weight="760" fill="#344841">PÉRIODE</text>
    <text x="494" y="224" font-size="11" fill="#66766F">Toutes</text>
    <line x1="601" y1="195" x2="601" y2="229" stroke="#D3DED7"/>
    <text x="621" y="208" font-size="10" font-weight="760" fill="#344841">SITUATION</text>
    <text x="621" y="224" font-size="11" fill="#66766F">Toutes</text>
    <line x1="738" y1="195" x2="738" y2="229" stroke="#D3DED7"/>
    <text x="758" y="208" font-size="10" font-weight="760" fill="#344841">PRÉCISION</text>
    <text x="758" y="224" font-size="11" fill="#66766F">Toutes</text>

    <g clip-path="url(#desktop-map)">
      <image href="map_orne_context_reel.svg" x="58" y="244" width="844" height="548" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <rect x="74" y="260" width="300" height="39" rx="19.5" fill="#FFFFFF" stroke="#D2DDD7"/>
    <text x="94" y="284" font-size="11" font-weight="720" fill="#344841">COUCHES</text>
    <circle cx="165" cy="279" r="4" fill="#4F89A8"/><text x="176" y="284" font-size="11" fill="#536760">Eau</text>
    <rect x="217" y="275" width="8" height="8" fill="#C8DDCB"/><text x="234" y="284" font-size="11" fill="#536760">Forêts</text>
    <line x1="286" y1="279" x2="304" y2="279" stroke="#414A46" stroke-dasharray="4 3"/><text x="311" y="284" font-size="11" fill="#536760">Rail actuel</text>

    <rect x="58" y="773" width="844" height="64" fill="#FCFAF5"/>
    <circle cx="81" cy="796" r="4" fill="#E45240"/>
    <text x="93" y="801" font-size="11" fill="#536760">Point approximatif</text>
    <rect x="230" y="792" width="8" height="8" fill="none" stroke="#7B5B8E"/>
    <text x="247" y="801" font-size="11" fill="#536760">Zone documentaire</text>
    <text x="58" y="825" font-size="11" fill="#536760">318 sites affichés · Les couches de contexte ne prouvent pas une relation historique.</text>

    <rect x="58" y="860" width="192" height="46" rx="23" fill="#173F35"/>
    <text x="86" y="888" font-size="12" font-weight="740" fill="#FFFFFF">Afficher la liste accessible</text>
    <text x="690" y="888" font-size="12" font-weight="720" fill="#C94333">Méthode et précision →</text>
    <text x="58" y="930" font-size="11" fill="#73817C">Pas d'agrégats : la distribution des 318 sites reste visible.</text>
  </g>

  <!-- Etat 2 -->
  <g filter="url(#shadow)">
    <rect x="968" y="102" width="600" height="405" rx="20" fill="#FCFAF5"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="994" y="137" font-size="11" font-weight="780" letter-spacing="1.5" fill="#C94333">ÉTAT 2 · FILTRE OUVERT</text>
    <text x="994" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#17211D">Choisir sans cacher les limites</text>

    <rect x="994" y="190" width="548" height="53" rx="14" fill="#F1F5F1"/>
    <text x="1016" y="211" font-size="10" font-weight="760" fill="#344841">CRITÈRES ACTIFS</text>
    <rect x="1016" y="218" width="172" height="22" rx="11" fill="#DCE9DF"/>
    <text x="1028" y="233" font-size="10" fill="#173F35">Textile, habillement et cuir ×</text>
    <text x="1434" y="225" font-size="11" font-weight="740" fill="#C94333">76 sites</text>

    <text x="994" y="279" font-size="11" font-weight="780" letter-spacing="1.2" fill="#344841">PÉRIODE D'ACTIVITÉ</text>
    <text x="994" y="301" font-size="11" fill="#65756F">42 phases concernant 29 sites sont suffisamment datées.</text>

    <g font-size="11" fill="#273A34">
      <rect x="994" y="322" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#A8B7B0"/>
      <text x="1022" y="335">Avant 1789</text>
      <rect x="994" y="352" width="16" height="16" rx="3" fill="#173F35"/>
      <path d="M998 360 L1002 364 L1008 356" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="1022" y="365">1789–1849 · première industrialisation</text>
      <rect x="994" y="382" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#A8B7B0"/>
      <text x="1022" y="395">1850–1913 · rail et vapeur</text>
    </g>

    <rect x="994" y="430" width="166" height="43" rx="21.5" fill="#173F35"/>
    <text x="1034" y="456" font-size="12" font-weight="740" fill="#FFFFFF">Voir les résultats</text>
    <text x="1480" y="456" font-size="11" fill="#C94333">Tout effacer</text>
  </g>

  <!-- Etat 3 -->
  <g filter="url(#shadow)">
    <rect x="968" y="535" width="600" height="417" rx="20" fill="#FCFAF5"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="994" y="570" font-size="11" font-weight="780" letter-spacing="1.5" fill="#C94333">ÉTAT 3 · MOBILE ET TACTILE</text>
    <text x="994" y="599" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#17211D">Le détail devient un volet inférieur</text>

    <rect x="994" y="612" width="262" height="316" rx="22" fill="#173F35"/>
    <rect x="1010" y="628" width="230" height="36" rx="12" fill="#FCFAF5"/>
    <text x="1026" y="651" font-size="10" fill="#65756F">Chercher…</text>
    <rect x="1175" y="634" width="53" height="24" rx="12" fill="#E45240"/>
    <text x="1187" y="650" font-size="9" font-weight="740" fill="#FFFFFF">Filtres 2</text>
    <g clip-path="url(#mobile-map)">
      <image href="map_orne_context_reel.svg" x="1010" y="662" width="230" height="150" preserveAspectRatio="xMidYMid meet"/>
    </g>
    <rect x="1010" y="780" width="230" height="132" rx="14" fill="#FCFAF5"/>
    <rect x="1100" y="788" width="50" height="4" rx="2" fill="#B7C2BD"/>
    <text x="1025" y="813" font-size="9" font-weight="760" letter-spacing="1" fill="#C94333">SITE SÉLECTIONNÉ</text>
    <text x="1025" y="838" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#17211D">Du moulin d'Ozé</text>
    <text x="1025" y="858" font-size="10" fill="#536760">Alençon · trois activités</text>
    <circle cx="1031" cy="880" r="4" fill="#7B5B8E"/>
    <text x="1043" y="884" font-size="9" fill="#5D4A6C">Zone documentaire</text>
    <text x="1154" y="899" font-size="9" font-weight="740" fill="#C94333">Ouvrir →</text>

    <g transform="translate(1287 648)">
      <text font-size="11" font-weight="780" fill="#344841">RÈGLES</text>
      <g font-size="12" fill="#52645E">
        <circle cx="4" cy="39" r="3" fill="#E45240"/><text x="17" y="43">La carte reste visible.</text>
        <circle cx="4" cy="76" r="3" fill="#E45240"/><text x="17" y="80">Le panneau possède un bouton fermer.</text>
        <circle cx="4" cy="113" r="3" fill="#E45240"/><text x="17" y="117">Aucun geste n'est obligatoire.</text>
        <circle cx="4" cy="150" r="3" fill="#E45240"/><text x="17" y="154">La liste fournit l'alternative accessible.</text>
        <circle cx="4" cy="187" r="3" fill="#E45240"/><text x="17" y="191">Les cibles tactiles font au moins 44 px.</text>
      </g>
    </g>
  </g>
</svg>
