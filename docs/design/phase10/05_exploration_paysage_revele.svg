<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Nouvelle maquette d'exploration — la carte avant l'interface</title>
  <desc id="desc">Le contour réel de l'Orne et les sites du corpus occupent l'écran. Les filtres sont compacts et un panneau temporaire apparaît après sélection du moulin d'Ozé.</desc>
  <defs>
    <filter id="float">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#17211D" flood-opacity="0.16"/>
    </filter>
    <style>
      .sans { font-family: Inter, Arial, sans-serif; }
      .serif { font-family: "Source Serif 4", Georgia, serif; }
    </style>
  </defs>

  <rect width="1440" height="1024" fill="#DDE9DF"/>
  <rect width="1440" height="74" fill="#173F35"/>
  <g class="sans" fill="#FCFAF5">
    <text x="42" y="46" font-size="15" font-weight="800">L’AUTRE ORNE</text>
    <text x="699" y="46" font-size="14" font-weight="650">Le récit</text>
    <rect x="775" y="18" width="96" height="38" rx="19" fill="#C94333"/>
    <text x="796" y="43" font-size="14" font-weight="750">Explorer</text>
    <text x="901" y="46" font-size="14" font-weight="650">Les lieux</text>
    <text x="984" y="46" font-size="14" font-weight="650">Méthode</text>
    <text x="1284" y="46" font-size="13" font-weight="700">À propos</text>
  </g>

  <g transform="translate(50 96)" filter="url(#float)">
    <rect width="1340" height="76" rx="38" fill="#FCFAF5"/>
    <g class="sans">
      <circle cx="35" cy="38" r="9" fill="none" stroke="#475B54" stroke-width="2"/>
      <line x1="42" y1="45" x2="49" y2="52" stroke="#475B54" stroke-width="2"/>
      <text x="64" y="44" fill="#475B54" font-size="15">Chercher un lieu, une commune, une activité…</text>
      <line x1="402" y1="18" x2="402" y2="58" stroke="#C7D5CB"/>
      <text x="432" y="44" fill="#17211D" font-size="14" font-weight="750">Activité</text>
      <text x="503" y="44" fill="#475B54" font-size="13">Toutes</text>
      <text x="557" y="44" fill="#173F35" font-size="16">⌄</text>
      <line x1="588" y1="18" x2="588" y2="58" stroke="#C7D5CB"/>
      <text x="618" y="44" fill="#17211D" font-size="14" font-weight="750">Période</text>
      <text x="682" y="44" fill="#475B54" font-size="13">Toutes</text>
      <text x="736" y="44" fill="#173F35" font-size="16">⌄</text>
      <line x1="766" y1="18" x2="766" y2="58" stroke="#C7D5CB"/>
      <text x="796" y="44" fill="#17211D" font-size="14" font-weight="750">Commune</text>
      <text x="875" y="44" fill="#475B54" font-size="13">Toutes</text>
      <text x="929" y="44" fill="#173F35" font-size="16">⌄</text>
      <line x1="959" y1="18" x2="959" y2="58" stroke="#C7D5CB"/>
      <text x="989" y="44" fill="#17211D" font-size="14" font-weight="750">Précision</text>
      <text x="1063" y="44" fill="#475B54" font-size="13">Toutes</text>
      <text x="1117" y="44" fill="#173F35" font-size="16">⌄</text>
      <rect x="1160" y="15" width="159" height="46" rx="23" fill="#173F35"/>
      <text x="1188" y="44" fill="#FCFAF5" font-size="13" font-weight="750">Liste accessible</text>
    </g>
  </g>

  <g transform="translate(54 194)">
    <text class="serif" x="0" y="35" fill="#17211D" font-size="38" font-weight="650">318 sites dans le paysage</text>
    <text class="sans" x="0" y="64" fill="#475B54" font-size="14">Sélectionnez un point, filtrez les activités ou revenez au récit.</text>
    <g transform="translate(34 96)">
      <image href="map_orne_corpus_reel.svg" x="0" y="0" width="1100" height="710"/>
      <circle cx="575.5" cy="496.1" r="16" fill="#FCFAF5" stroke="#F05A47" stroke-width="5"/>
      <circle cx="575.5" cy="496.1" r="5.5" fill="#F05A47"/>
      <circle cx="575.5" cy="496.1" r="23" fill="none" stroke="#F05A47" stroke-width="2" stroke-dasharray="4 5"/>
      <path d="M595 482 C658 443 716 420 782 414" fill="none" stroke="#F05A47" stroke-width="2"/>
    </g>
  </g>

  <g transform="translate(927 505)" filter="url(#float)">
    <rect width="436" height="414" rx="18" fill="#FCFAF5"/>
    <g transform="translate(28 29)">
      <g class="sans">
        <text x="0" y="0" fill="#C94333" font-size="11" font-weight="850" letter-spacing="1.7">SITE SÉLECTIONNÉ · ALENÇON</text>
        <text x="355" y="1" fill="#475B54" font-size="18">×</text>
      </g>
      <text class="serif" x="0" y="55" fill="#17211D" font-size="34" font-weight="650">Du moulin d’Ozé</text>
      <text class="serif" x="0" y="91" fill="#17211D" font-size="34" font-weight="650">à Moulinex</text>
      <text class="sans" x="0" y="124" fill="#475B54" font-size="14">Un même lieu, trois vies productives documentées.</text>

      <g transform="translate(0 161)">
        <line x1="9" y1="7" x2="342" y2="7" stroke="#93AA9C" stroke-width="2"/>
        <circle cx="9" cy="7" r="8" fill="#2F6F8F"/>
        <circle cx="176" cy="7" r="8" fill="#FFD166"/>
        <circle cx="342" cy="7" r="8" fill="#F05A47"/>
        <g class="sans">
          <text x="0" y="43" fill="#17211D" font-size="13" font-weight="750">Moulin</text>
          <text x="158" y="43" fill="#17211D" font-size="13" font-weight="750">Filature</text>
          <text x="306" y="43" fill="#17211D" font-size="13" font-weight="750">Moulinex</text>
          <text x="0" y="64" fill="#475B54" font-size="11">farine</text>
          <text x="158" y="64" fill="#475B54" font-size="11">textile</text>
          <text x="306" y="64" fill="#475B54" font-size="11">électroménager</text>
        </g>
      </g>

      <line x1="0" y1="250" x2="380" y2="250" stroke="#C7D5CB"/>
      <text class="sans" x="0" y="282" fill="#17211D" font-size="14" font-weight="750">Pourquoi ce lieu apparaît dans le récit</text>
      <text class="sans" x="0" y="308" fill="#475B54" font-size="13">Sa trajectoire rend visible le passage d’une énergie</text>
      <text class="sans" x="0" y="329" fill="#475B54" font-size="13">hydraulique ancienne à une production du XXe siècle.</text>
      <text class="sans" x="0" y="367" fill="#C94333" font-size="13" font-weight="800">Ouvrir le portrait →</text>
      <text class="sans" x="232" y="367" fill="#173F35" font-size="13" font-weight="750">Voir les sources</text>
    </g>
  </g>

  <g transform="translate(50 951)" class="sans">
    <rect width="244" height="42" rx="21" fill="#FCFAF5" fill-opacity="0.94"/>
    <circle cx="23" cy="21" r="5" fill="#F05A47"/>
    <text x="37" y="26" fill="#475B54" font-size="12">1 point = 1 site du corpus</text>
    <rect x="256" width="191" height="42" rx="21" fill="#FCFAF5" fill-opacity="0.94"/>
    <text x="279" y="26" fill="#475B54" font-size="12">Légende et précision ＋</text>
    <text x="1114" y="26" fill="#475B54" font-size="11">Sources cartographiques · méthode</text>
  </g>
</svg>
