      <text class="sans muted" x="0" y="68" font-size="14">318 sites · 403 phases d’activité</text>
      <rect x="0" y="92" width="256" height="46" rx="2" fill="#F3EFE6" stroke="#CBC4B8"/>
      <circle cx="23" cy="115" r="7" fill="none" stroke="#5E6568" stroke-width="1.4"/>
      <line x1="28" y1="120" x2="33" y2="125" stroke="#5E6568" stroke-width="1.4"/>
      <text class="sans muted" x="46" y="121" font-size="14">Nom, commune, activité…</text>

      <g transform="translate(0 166)" class="sans">
        <text class="mono oxide smallcaps" x="0" y="12">FILTRES</text>
        <line x1="0" y1="29" x2="256" y2="29" stroke="#CBC4B8"/>
        <text class="ink" x="0" y="61" font-size="15" font-weight="650">Activité ou secteur</text>
        <text class="muted" x="242" y="61" font-size="18">⌄</text>
        <rect x="0" y="78" width="114" height="30" rx="15" fill="#171A1C"/>
        <text x="16" y="98" fill="#FFFDF8" font-size="12" font-weight="600">Bois et papier ×</text>
        <line x1="0" y1="126" x2="256" y2="126" stroke="#E3DED4"/>
        <text class="ink" x="0" y="158" font-size="15" font-weight="650">Période</text>
        <text class="muted" x="242" y="158" font-size="18">⌄</text>
        <line x1="0" y1="176" x2="256" y2="176" stroke="#E3DED4"/>
        <text class="ink" x="0" y="208" font-size="15" font-weight="650">Commune</text>
        <text class="muted" x="242" y="208" font-size="18">⌄</text>
        <line x1="0" y1="226" x2="256" y2="226" stroke="#E3DED4"/>
