        <circle cx="96" cy="297" r="5"/><circle cx="113" cy="370" r="5"/><circle cx="141" cy="244" r="5"/>
        <circle cx="166" cy="306" r="5"/><circle cx="187" cy="352" r="5"/><circle cx="215" cy="262" r="5"/>
        <circle cx="239" cy="391" r="5"/><circle cx="260" cy="321" r="5"/><circle cx="286" cy="429" r="5"/>
        <circle cx="307" cy="261" r="5"/><circle cx="336" cy="350" r="5"/><circle cx="359" cy="218" r="5"/>
        <circle cx="383" cy="403" r="5"/><circle cx="405" cy="306" r="5"/><circle cx="432" cy="468" r="5"/>
        <circle cx="454" cy="253" r="5"/><circle cx="479" cy="358" r="5"/><circle cx="508" cy="417" r="5"/>
        <circle cx="530" cy="203" r="5"/><circle cx="554" cy="302" r="5"/><circle cx="581" cy="376" r="5"/>
        <circle cx="553" cy="485" r="5"/><circle cx="480" cy="535" r="5"/><circle cx="398" cy="559" r="5"/>
        <circle cx="318" cy="540" r="5"/><circle cx="249" cy="496" r="5"/><circle cx="180" cy="467" r="5"/>
