      <text class="sans muted" x="0" y="383" font-size="11">© Région Normandie — Inventaire général · notice source</text>

      <line x1="0" y1="409" x2="334" y2="409" stroke="#CBC4B8"/>
      <text class="sans ink" x="0" y="442" font-size="15" font-weight="700">Pourquoi ce site compte</text>
      <text class="sans muted" x="0" y="469" font-size="14">Une production papetière reliée à Mâle par voie</text>
      <text class="sans muted" x="0" y="491" font-size="14">étroite, tournée vers des marchés extérieurs et</text>
      <text class="sans muted" x="0" y="513" font-size="14">associée à des logements ouvriers.</text>

      <g transform="translate(0 544)" class="sans">
        <text class="mono oxide smallcaps" x="0" y="12">REPÈRES</text>
