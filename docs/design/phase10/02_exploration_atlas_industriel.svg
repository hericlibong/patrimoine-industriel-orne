        <text class="ink" x="0" y="68" font-size="13" font-weight="650">Période</text>
        <text class="muted" x="102" y="68" font-size="13">XIXe–XXe siècle</text>
        <text class="ink" x="0" y="94" font-size="13" font-weight="650">Précision</text>
        <text class="oxide" x="102" y="94" font-size="13" font-weight="650">Position approximative</text>
      </g>

      <g transform="translate(0 674)" class="sans">
        <rect width="334" height="48" rx="2" fill="#9B3F2B"/>
        <text x="82" y="30" fill="#FFFDF8" font-size="14" font-weight="700">Lire le portrait complet →</text>
        <rect y="62" width="334" height="48" rx="2" fill="#FFFDF8" stroke="#171A1C"/>
        <text class="ink" x="80" y="92" font-size="14" font-weight="650">Voir dans le chapitre 4</text>
      </g>

      <g transform="translate(0 822)" class="sans">
        <line x1="0" y1="0" x2="334" y2="0" stroke="#CBC4B8"/>
        <text class="muted" x="0" y="27" font-size="12">Sources, limites et crédits</text>
        <text class="oxide" x="282" y="27" font-size="16">＋</text>
