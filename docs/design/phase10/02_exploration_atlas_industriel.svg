      <path d="M51 289 L87 215 L147 184 L199 117 L270 120 L313 157 L374 140 L420 75 L490 50 L542 86 L574 139 L637 171 L664 234 L635 286 L671 350 L643 407 L666 466 L625 500 L594 564 L545 592 L509 646 L451 626 L405 664 L357 632 L317 588 L264 598 L229 555 L175 570 L132 527 L79 543 L45 501 L13 449 L34 391 L8 348 Z"
