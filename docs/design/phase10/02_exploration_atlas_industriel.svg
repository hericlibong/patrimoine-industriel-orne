          <text class="mono oxide" x="16" y="72" font-size="10">POSITION APPROXIMATIVE</text>
        </g>
        <g transform="translate(0 139)">
          <circle cx="18" cy="18" r="6" fill="#171A1C"/>
          <text class="sans ink" x="34" y="22" font-size="14" font-weight="650">Imprimerie de Montligeon</text>
          <text class="sans muted" x="16" y="45" font-size="12">La Chapelle-Montligeon · imprimerie</text>
        </g>
        <line x1="0" y1="201" x2="256" y2="201" stroke="#E3DED4"/>
        <g transform="translate(0 219)">
          <circle cx="18" cy="18" r="6" fill="#171A1C"/>
          <text class="sans ink" x="34" y="22" font-size="14" font-weight="650">Moulin à papier puis filature</text>
          <text class="sans muted" x="16" y="45" font-size="12">Tinchebray · papier et textile</text>
        </g>
        <line x1="0" y1="281" x2="256" y2="281" stroke="#E3DED4"/>
        <text class="sans oxide" x="0" y="320" font-size="13" font-weight="650">Afficher les 39 autres résultats ↓</text>
