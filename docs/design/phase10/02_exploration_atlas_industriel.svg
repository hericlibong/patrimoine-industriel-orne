<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Maquette de l'exploration — Atlas industriel vivant</title>
  <desc id="desc">Exploration cartographique en trois zones avec recherche et filtres, carte centrale et panneau de détail d'un site sélectionné.</desc>
  <defs>
    <pattern id="mapgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#CBC4B8" stroke-width="0.55" opacity="0.52"/>
    </pattern>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFDF8" opacity="0.32"/>
    </pattern>
    <style>
      .sans { font-family: "IBM Plex Sans", Arial, sans-serif; }
      .serif { font-family: "Newsreader", Georgia, serif; }
      .mono { font-family: "IBM Plex Mono", Consolas, monospace; }
      .ink { fill: #171A1C; }
      .muted { fill: #5E6568; }
      .oxide { fill: #9B3F2B; }
      .smallcaps { font-size: 11px; font-weight: 650; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect width="1440" height="1024" fill="#F3EFE6"/>
  <rect width="1440" height="76" fill="#FFFDF8"/>
  <line y1="76" x2="1440" y2="76" stroke="#CBC4B8"/>
  <g class="sans ink">
    <circle cx="38" cy="38" r="12" fill="#9B3F2B"/>
    <circle cx="38" cy="38" r="4" fill="#FFFDF8"/>
    <text x="62" y="44" font-size="15" font-weight="700" letter-spacing="0.7">L’ORNE INDUSTRIELLE</text>
    <text x="726" y="44" font-size="14">Le récit</text>
    <rect x="799" y="19" width="96" height="38" rx="19" fill="#171A1C"/>
    <text x="819" y="44" fill="#FFFDF8" font-size="14" font-weight="650">Explorer</text>
    <text x="922" y="44" font-size="14">Les portraits</text>
    <text x="1036" y="44" font-size="14">Méthode</text>
    <rect x="1215" y="19" width="175" height="38" rx="2" fill="#F3EFE6"/>
    <circle cx="1238" cy="38" r="7" fill="none" stroke="#5E6568" stroke-width="1.4"/>
    <line x1="1243" y1="43" x2="1248" y2="48" stroke="#5E6568" stroke-width="1.4"/>
    <text x="1260" y="43" font-size="13" fill="#5E6568">Rechercher…</text>
  </g>

  <g transform="translate(0 76)">
