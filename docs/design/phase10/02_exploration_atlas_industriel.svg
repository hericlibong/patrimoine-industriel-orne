  <g transform="translate(1050 76)">
    <rect width="390" height="948" fill="#FFFDF8"/>
    <g transform="translate(28 28)">
      <text class="mono oxide smallcaps" x="0" y="12">SITE SÉLECTIONNÉ · IA00061086</text>
      <text class="serif ink" x="0" y="64" font-size="39" font-weight="650">Usine à papier</text>
      <text class="serif ink" x="0" y="105" font-size="39" font-weight="650">Abadie</text>
      <text class="sans muted" x="0" y="137" font-size="14">Le Theil · Val-au-Perche</text>

      <g transform="translate(0 164)">
        <rect width="334" height="182" rx="2" fill="#3B4042"/>
        <rect width="334" height="182" fill="url(#dots)"/>
        <path d="M20 148 H314 V170 H20 Z" fill="#202426"/>
        <path d="M38 148 V82 H127 V148 M148 148 V55 H260 V148 M276 148 V96 H310 V148" fill="#777D7E"/>
        <path d="M38 82 L82 59 L127 82 M148 55 L204 28 L260 55" fill="#9BA0A1"/>
        <rect x="14" y="13" width="167" height="24" rx="2" fill="#FFFDF8" opacity="0.9"/>
