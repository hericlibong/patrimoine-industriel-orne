<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-label="Planche fonctionnelle du bloc 5 montrant le panneau de site, la page Les lieux et la page méthode">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#173F35" flood-opacity="0.16"/>
    </filter>
    <clipPath id="oze"><rect x="52" y="253" width="398" height="184" rx="12"/></clipPath>
    <clipPath id="abadie"><rect x="494" y="182" width="652" height="288" rx="12"/></clipPath>
  </defs>

  <rect width="1600" height="1050" fill="#E7F0EA"/>
  <g font-family="Inter, Arial, sans-serif" fill="#17211D">
    <text x="40" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Bloc 5 — trois niveaux de contenu</text>
    <text x="40" y="75" font-size="13" fill="#52645E">Un panneau pour les 318 sites, des pages Les lieux sélectionnées et une méthode commune.</text>
  </g>

  <!-- Panneau -->
  <g filter="url(#shadow)">
    <rect x="28" y="104" width="446" height="906" rx="22" fill="#FCFAF5"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="52" y="140" font-size="11" font-weight="780" letter-spacing="1.5" fill="#C94333">NIVEAU 1 · PANNEAU CARTOGRAPHIQUE</text>
    <text x="52" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#17211D">Comprendre le marqueur</text>
    <text x="52" y="198" font-size="12" fill="#65756F">Disponible pour les 318 sites · pas un mini-article</text>

    <text x="52" y="231" font-size="10" font-weight="780" letter-spacing="1.2" fill="#344841">ALENÇON · SITE SÉLECTIONNÉ</text>
    <g clip-path="url(#oze)">
      <image href="reference_oze_1987.jpg" x="52" y="253" width="398" height="184" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <text x="52" y="457" font-size="10" fill="#65756F">Vue aérienne, 1987 · référence et crédit visibles</text>

    <text x="52" y="490" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" fill="#17211D">Du moulin d'Ozé</text>
    <text x="52" y="519" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" fill="#17211D">à Moulinex</text>
    <text x="52" y="544" font-size="13" fill="#52645E">Un même lieu, trois activités documentées.</text>

    <text x="52" y="566" font-size="10" font-weight="780" letter-spacing="1.2" fill="#344841">ACTIVITÉS SUCCESSIVES</text>
    <line x1="62" y1="603" x2="419" y2="603" stroke="#A8B7B0" stroke-width="3"/>
    <circle cx="62" cy="603" r="8" fill="#2F6F8F"/>
    <circle cx="213" cy="603" r="8" fill="#FFD166"/>
    <circle cx="360" cy="603" r="8" fill="#E45240"/>
    <path d="M360 603 L419 603" stroke="#7B5B8E" stroke-width="3" stroke-dasharray="5 5"/>
    <g font-size="10" fill="#344841">
      <text x="52" y="628" font-weight="740">1809</text><text x="52" y="644">Moulin</text>
      <text x="184" y="628" font-weight="740">vers 1840</text><text x="184" y="644">Filature</text>
      <text x="331" y="628" font-weight="740">vers 1937</text><text x="331" y="644">Moulinex</text>
      <text x="374" y="585" fill="#7B5B8E">fin inconnue</text>
    </g>

    <text x="52" y="686" font-size="10" font-weight="780" letter-spacing="1.2" fill="#344841">SITUATION ACTUELLE</text>
    <rect x="52" y="701" width="398" height="70" rx="12" fill="#F1EEF5"/>
    <circle cx="72" cy="724" r="5" fill="#7B5B8E"/>
    <text x="87" y="728" font-size="12" font-weight="740" fill="#4D3E5B">Non documentée récemment</text>
    <text x="68" y="752" font-size="10" fill="#665A6F">Conservation, usage et accessibilité restent inconnus.</text>

    <text x="52" y="810" font-size="10" font-weight="780" letter-spacing="1.2" fill="#344841">LOCALISATION</text>
    <rect x="52" y="826" width="156" height="30" rx="15" fill="#F4F0F7"/>
    <rect x="67" y="836" width="9" height="9" fill="none" stroke="#7B5B8E"/>
    <text x="84" y="846" font-size="10" fill="#5D4A6C">Zone documentaire</text>
    <line x1="52" y1="883" x2="450" y2="883" stroke="#D6DFDA"/>
    <text x="52" y="916" font-size="12" font-weight="740" fill="#C94333">Ouvrir ce lieu →</text>
    <text x="342" y="916" font-size="12" font-weight="700" fill="#173F35">Sources</text>
    <text x="52" y="974" font-size="10" fill="#73817C">Sans image retenue, le titre remonte : aucun faux placeholder.</text>
  </g>

  <!-- Les lieux -->
  <g filter="url(#shadow)">
    <rect x="474" y="104" width="696" height="906" rx="22" fill="#FCFAF5"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="494" y="140" font-size="11" font-weight="780" letter-spacing="1.5" fill="#C94333">NIVEAU 2 · PAGE « LES LIEUX »</text>
    <text x="494" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#17211D">Répondre à une question journalistique</text>
    <g clip-path="url(#abadie)">
      <image href="reference_abadie_vue_aerienne.jpg" x="494" y="182" width="652" height="288" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <rect x="494" y="404" width="652" height="66" fill="#102D27" fill-opacity="0.82"/>
    <text x="516" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#FCFAF5">L'usine Abadie dans son territoire</text>
    <text x="516" y="452" font-size="11" fill="#E5ECE8">Image datée · légende · crédit · lien vers le document complet</text>

    <text x="494" y="508" font-size="10" font-weight="780" letter-spacing="1.2" fill="#C94333">QUESTION</text>
    <text x="494" y="537" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#17211D">Comment l'usine s'inscrit-elle entre bourg, rivière et champs ?</text>

    <rect x="494" y="565" width="310" height="145" rx="14" fill="#EAF0EC"/>
    <text x="514" y="592" font-size="10" font-weight="780" letter-spacing="1.1" fill="#344841">CE QUE L'IMAGE MONTRE</text>
    <text x="514" y="621" font-size="12" fill="#52645E">
      <tspan x="514">Une lecture spatiale annotée :</tspan>
      <tspan x="514" dy="21">usine, bourg, eau, champs et voies.</tspan>
      <tspan x="514" dy="21">L'image observe ; les sources établissent.</tspan>
    </text>

    <rect x="822" y="565" width="324" height="145" rx="14" fill="#F7F1E6"/>
    <text x="842" y="592" font-size="10" font-weight="780" letter-spacing="1.1" fill="#344841">ÉVOLUTION DU LIEU</text>
    <line x1="842" y1="635" x2="1118" y2="635" stroke="#A7B5AF" stroke-width="3"/>
    <circle cx="842" cy="635" r="7" fill="#2F6F8F"/>
    <circle cx="935" cy="635" r="7" fill="#E45240"/>
    <circle cx="1024" cy="635" r="7" fill="#FFD166"/>
    <circle cx="1118" cy="635" r="7" fill="#C94333"/>
    <g font-size="9" fill="#52645E">
      <text x="832" y="658">1809</text><text x="920" y="658">1866</text>
      <text x="1009" y="658">1885</text><text x="1091" y="658">vers 1978</text>
    </g>
    <text x="842" y="688" font-size="10" fill="#65756F">Dates qualifiées, fin ouverte si nécessaire.</text>

    <rect x="494" y="728" width="652" height="100" rx="14" fill="#F1EEF5"/>
    <text x="514" y="754" font-size="10" font-weight="780" letter-spacing="1.1" fill="#4D3E5B">SITUATION ACTUELLE · BLOC DISTINCT</text>
    <text x="514" y="783" font-size="12" fill="#5D4A6C">Activité : cessation vers 1978</text>
    <text x="778" y="783" font-size="12" fill="#5D4A6C">Conservation : inconnue</text>
    <text x="1004" y="783" font-size="12" fill="#5D4A6C">Usage : inconnu</text>
    <text x="514" y="808" font-size="10" fill="#74677E">Une activité terminée ne permet pas de déduire l'état des bâtiments.</text>

    <rect x="494" y="846" width="316" height="92" rx="14" fill="#EAF0EC"/>
    <text x="514" y="872" font-size="10" font-weight="780" fill="#344841">CARTE ET PRÉCISION</text>
    <text x="514" y="897" font-size="11" fill="#52645E">Contexte géographique + niveau de précision.</text>
    <text x="514" y="919" font-size="10" fill="#65756F">Aucune relation historique déduite du fond.</text>

    <rect x="830" y="846" width="316" height="92" rx="14" fill="#F7F1E6"/>
    <text x="850" y="872" font-size="10" font-weight="780" fill="#344841">SOURCES ET CRÉDITS</text>
    <text x="850" y="897" font-size="11" fill="#52645E">Références liées aux affirmations.</text>
    <text x="850" y="919" font-size="10" fill="#65756F">Crédit visible sous chaque média.</text>

    <text x="494" y="974" font-size="10" fill="#73817C">Modules facultatifs seulement s'ils servent la question : flux, plan, graphique, comparaison.</text>
  </g>

  <!-- Méthode -->
  <g filter="url(#shadow)">
    <rect x="1190" y="104" width="382" height="906" rx="22" fill="#FCFAF5"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="1212" y="140" font-size="11" font-weight="780" letter-spacing="1.5" fill="#C94333">NIVEAU 3 · MÉTHODE</text>
    <text x="1212" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#17211D">Rendre l'enquête vérifiable</text>
    <text x="1212" y="202" font-size="12" fill="#65756F">Une page éditoriale, pas la documentation du dépôt.</text>

    <rect x="1212" y="226" width="338" height="84" rx="14" fill="#173F35"/>
    <text x="1234" y="252" font-size="10" font-weight="780" letter-spacing="1" fill="#FFD166">EN BREF</text>
    <text x="1234" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#FCFAF5">318 sites · 403 phases</text>
    <text x="1234" y="298" font-size="9" fill="#DCE7E2">Version, date et périmètre toujours visibles</text>

    <text x="1212" y="350" font-size="10" font-weight="780" letter-spacing="1.2" fill="#344841">SOMMAIRE ANCRÉ</text>
    <g font-size="12" fill="#334740">
      <rect x="1212" y="369" width="338" height="48" rx="10" fill="#EAF0EC"/>
      <text x="1230" y="398" font-weight="740">1. Périmètre du corpus</text>
      <rect x="1212" y="427" width="338" height="48" rx="10" fill="#F3F6F3"/>
      <text x="1230" y="456">2. Des sources aux 318 sites</text>
      <rect x="1212" y="485" width="338" height="48" rx="10" fill="#F3F6F3"/>
      <text x="1230" y="514">3. Activités et secteurs</text>
      <rect x="1212" y="543" width="338" height="48" rx="10" fill="#F3F6F3"/>
      <text x="1230" y="572">4. Temps et chronologies</text>
      <rect x="1212" y="601" width="338" height="48" rx="10" fill="#F3F6F3"/>
      <text x="1230" y="630">5. Carte et précision</text>
      <rect x="1212" y="659" width="338" height="48" rx="10" fill="#F3F6F3"/>
      <text x="1230" y="688">6. Situation actuelle</text>
      <rect x="1212" y="717" width="338" height="48" rx="10" fill="#F3F6F3"/>
      <text x="1230" y="746">7. Textes, images et droits</text>
      <rect x="1212" y="775" width="338" height="48" rx="10" fill="#F3F6F3"/>
      <text x="1230" y="804">8. Sources, version et limites</text>
    </g>

    <text x="1212" y="865" font-size="10" font-weight="780" letter-spacing="1.1" fill="#344841">SCHÉMA CENTRAL</text>
    <g font-size="10" font-weight="720">
      <rect x="1212" y="884" width="65" height="34" rx="17" fill="#DCE9DF"/><text x="1225" y="905" fill="#173F35">Sources</text>
      <text x="1284" y="906" fill="#C94333">→</text>
      <rect x="1298" y="884" width="86" height="34" rx="17" fill="#DCE9DF"/><text x="1310" y="905" fill="#173F35">Rapprocher</text>
      <text x="1392" y="906" fill="#C94333">→</text>
      <rect x="1407" y="884" width="58" height="34" rx="17" fill="#DCE9DF"/><text x="1420" y="905" fill="#173F35">Sites</text>
      <text x="1474" y="906" fill="#C94333">→</text>
      <rect x="1488" y="884" width="62" height="34" rx="17" fill="#DCE9DF"/><text x="1498" y="905" fill="#173F35">Publier</text>
    </g>
    <text x="1212" y="956" font-size="10" fill="#73817C">Exemples, tableaux accessibles et liens vers les sources.</text>
    <text x="1212" y="976" font-size="10" fill="#73817C">Scripts, tables et chemins locaux restent dans la maintenance.</text>
  </g>
</svg>
