    libelleSource: Lire l'étude historique
    histoire: >-
      À partir de 1858, le domaine d'Avoise est aménagé en ferme-usine.
      La betterave y est transformée en alcool dans une distillerie industrielle,
      et sa pulpe sert à nourrir les bovins. Une machine à vapeur participe aux
      installations. En 1879, la production d'alcool est abandonnée et la
      distillerie devient un espace de stockage. L'exploitation se tourne vers
      la polyculture et l'élevage. Une description publiée en 1919 mentionne
      une cidrerie, une laiterie équipée de glacières, un moulin desservant
      l'établissement et les cultivateurs des environs, ainsi que des logements
      ouvriers. Un cliché de 1950 montre un tracteur sur le site. À partir de
      1960, le domaine est de nouveau orienté vers la production céréalière.
    sources:
      - titre: Archives de l'Orne — La révolution aux champs, catalogue, 1998
        url: https://archives.orne.fr/sites/default/files/2020-09/CAT77.pdf
        repere: La ferme-modèle d'Avoise à Radon, documents 46 et 47
