    histoire: >-
      Ferdinand-Louis Caillet fait construire la ferme de la Normanderie en
      1863. L'exploitation associe betteraves, distillerie et engraissement de
      bovins. Des voies ferrées intérieures relient les installations.
      La distillerie communique avec le silo à pulpe, la grange et l'étable.
      La maison d'habitation est détruite en 1967. Les façades et toitures des
      bâtiments subsistants sont inscrites aux Monuments historiques le 30 juin 2005.
    sources:
