    histoire: >-
      Vers 1860, Briante est l'une des trois grandes exploitations créées dans
      la plaine d'Alençon pour cultiver et distiller la betterave à sucre,
      avec Avoise et la Normanderie. Le domaine se trouve à Colombiers.
      Les Archives de l'Orne conservent aussi un dossier mentionnant sa prise
      d'eau sur la Briante et une demande de suppression de cette prise en 1901.
