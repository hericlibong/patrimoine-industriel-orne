version: "1.0"
decided_at: 2026-07-23
scope: corpus_officiel_319_dossiers

regles:
  fusion_automatique: interdite
  unite_canonique: emprise_physique_stable
  dossier_collectif_sans_emprise: conserve_comme_source_hors_decompte_sites
  complexe_industriel: parent_et_composants_restent_des_sites_distincts_relies

rapprochements:
  - references: [IA00060967, IA00061034]
    decision: rejete_sites_distincts
    justification: >-
      Le tissage de mèches et la filature Vente ont des histoires, des
      fonctions et des points distincts malgré le même lieu-dit
      Pont-Erembourg.
  - references: [IA00060978, IA00060979]
    decision: rejete_sites_distincts
    justification: >-
      Les deux tissages de Maure ont des dates de fondation, exploitants,
      adresses et emprises différentes.
  - references: [IA00060986, IA00060998]
    decision: rejete_sites_distincts
    justification: >-
      Les deux usines de blanchiment de la rue Pierre-Neveu sont séparées
      d'environ 94 mètres et sont attribuées à des fondateurs distincts.
  - references: [IA00061037, IA00061038]
    decision: rejete_sites_distincts
    justification: >-
      Deux filatures distinctes sont attestées au Champ-Ferment, avec des
      propriétaires, des transformations et des bâtiments propres.
  - references: [IA00061078, IA00061079]
    decision: rejete_sites_distincts
    justification: >-
      Les établissements des numéros 15 et 16 rue du Pont-du-Moulin sont deux
      emprises voisines, mais leurs fondateurs et leurs chronologies diffèrent.
  - references: [IA00061147, IA00061159]
    decision: rejete_sites_distincts
    justification: >-
      La cartonnerie et l'usine à gaz sont deux établissements sans continuité
      documentée, malgré le lieu-dit commun de la Gare.
  - references: [IA00061187, IA00061188]
    decision: rejete_sites_distincts
    justification: >-
      L'affinerie-moulin et la fenderie occupent deux emprises proches mais
      distinctes. La fenderie dépend historiquement de l'ensemble métallurgique.

dossier_collectif:
  reference: IA61001399
  decision: exclu_du_decompte_sites
  nature: dossier_de_synthese_sans_emprise
  justification: >-
    La notice ne possède ni commune, ni code INSEE, ni adresse, ni historique
    de site. Elle présente les fromageries industrielles disparues de l'Orne.
    Les quinze dossiers individuels concernés sont déjà présents dans le
    corpus officiel.
  dossiers_individuels_deja_presents:
    - IA00060890
    - IA00060891
    - IA00060902
    - IA00060905
    - IA00060937
    - IA00060939
    - IA00060940
    - IA00060943
    - IA00060955
    - IA00060970
    - IA00060993
    - IA00061133
    - IA00061176
    - IA00061177
    - IA00061199

relations_sites:
  - source_reference: IA00061009
    target_reference: IA00060961
    type_relation_code: composant_de
    fiabilite_code: forte
    justification: >-
      La notice indique explicitement que la cité ouvrière fait partie de
      l'ensemble d'industrie extractive de la mine de Halouze.
  - source_reference: IA00061011
    target_reference: IA00060961
    type_relation_code: composant_de
    fiabilite_code: forte
    justification: >-
      La notice indique explicitement que la cité Lebardier fait partie de
      l'ensemble d'industrie extractive de la mine de Halouze.
  - source_reference: IA00061200
    target_reference: IA00060912
    type_relation_code: depend_de
    fiabilite_code: forte
    justification: >-
      La cité est construite par la société exploitant la concession minière
      de La Ferrière-aux-Étangs pour loger sa main-d'œuvre.
  - source_reference: IA00061201
    target_reference: IA00060912
    type_relation_code: depend_de
    fiabilite_code: forte
    justification: >-
      La cité du Gué-Plat est construite et agrandie par la société exploitant
      la mine de La Ferrière-aux-Étangs.
  - source_reference: IA00061188
    target_reference: IA00061187
    type_relation_code: depend_de
    fiabilite_code: forte
    justification: >-
      La notice décrit la fenderie comme dépendant de l'affinerie et du haut
      fourneau de Larchamp.
  - source_reference: IA00061039
    target_reference: IA00060893
    type_relation_code: approvisionne
    fiabilite_code: forte
    justification: >-
      L'usine du Plafond produit les tissus d'amiante imprégnés sur ce site à partir de 1928.
  - source_reference: IA00060894
    target_reference: IA00060964
    type_relation_code: approvisionne
    fiabilite_code: forte
    justification: >-
      Le haut fourneau de Dompierre alimentait en gueuses l'affinerie de Varenne. Les deux notices l'attestent.
  - source_reference: IA00060915
    target_reference: IA00060913
    type_relation_code: approvisionne
    fiabilite_code: forte
    justification: >-
      Le tissage est alimenté en fils de coton par la filature de la Planchette.
  - source_reference: IA00060947
    target_reference: IA00060946
    type_relation_code: approvisionne
    fiabilite_code: forte
    justification: >-
      Le haut fourneau alimentait en fonte l'affinerie transférée à Cossé à la fin du 16e siècle.
  - source_reference: IA00061024
    target_reference: IA00061025
    type_relation_code: approvisionne
    fiabilite_code: forte
    justification: >-
      Le haut fourneau alimentait en fonte la forge de Carrouges.
  - source_reference: IA00061039
    target_reference: IA00061040
    type_relation_code: approvisionne
    fiabilite_code: forte
    justification: >-
      Les fils d'amiante assemblés ici sont produits à l'usine du Plafond.
  - source_reference: IA00061087
    target_reference: IA00060949
    type_relation_code: approvisionne
    fiabilite_code: forte
    justification: >-
      Le haut fourneau alimentait la forge de la Roche.
  - source_reference: IA00061053
    target_reference: IA00061144
    type_relation_code: approvisionne
    fiabilite_code: forte
    justification: >-
      Les métaux non ferreux matricés ici sont produits à Boisthorel et livrés par voie ferrée particulière.
  - source_reference: IA00061053
    target_reference: IA00061145
    type_relation_code: approvisionne
    fiabilite_code: forte
    justification: >-
      Les fils de laiton, de bronze et de maillechort sont fournis par l'usine voisine de Boisthorel.
  - source_reference: IA00061093
    target_reference: IA00061094
    type_relation_code: approvisionne
    fiabilite_code: forte
    justification: >-
      Le haut fourneau de Gaillon alimentait en gueuses les forges de Gaillon et de Randonnai.
  - source_reference: IA00061093
    target_reference: IA00061158
    type_relation_code: approvisionne
    fiabilite_code: forte
    justification: >-
      Le haut fourneau de Gaillon alimentait en gueuses les forges de Gaillon et de Randonnai.
  - source_reference: IA00061094
    target_reference: IA00061096
    type_relation_code: approvisionne
    fiabilite_code: forte
    justification: >-
      La fenderie était alimentée en fer par les affineries de Gaillon et de Randonnai.
  - source_reference: IA00061158
    target_reference: IA00061096
    type_relation_code: approvisionne
    fiabilite_code: forte
    justification: >-
      La fenderie était alimentée en fer par les affineries de Gaillon et de Randonnai.
  - source_reference: IA00061023
    target_reference: IA00060948
    type_relation_code: approvisionne
    fiabilite_code: forte
    justification: >-
      La fenderie était alimentée en fer par la forge du Champ-de-la-Pierre. La commune ne compte que ces deux sites.
  - source_reference: IA00061112
    target_reference: IA00061153
    type_relation_code: approvisionne
    fiabilite_code: faible
    justification: >-
      Deux établissements non localisés alimentaient en gueuses une affinerie « peut-être » établie à Beaumont. La source doute elle-même.
  - source_reference: IA00061033
    target_reference: IA00061155
    type_relation_code: transfert_vers
    fiabilite_code: moyenne
    justification: >-
      Production transférée après 1945 à l'usine de Saint-Sulpice-sur-Risle. La commune compte cinq sites ; le rachat par Bohin en 1887 désigne les établissements Bohin. La source ne le nomme pas.
  - source_reference: IA00061113
    target_reference: IA00061155
    type_relation_code: transfert_vers
    fiabilite_code: moyenne
    justification: >-
      Production transférée après 1945 à l'usine de Saint-Sulpice-sur-Risle. Site racheté par Bohin vers 1909. La source ne nomme pas la cible.
  - source_reference: IA00061114
    target_reference: IA00061155
    type_relation_code: transfert_vers
    fiabilite_code: moyenne
    justification: >-
      Fabrication transférée après 1945 à l'usine de Saint-Sulpice-sur-Risle. Site racheté par Bohin vers 1893. La source ne nomme pas la cible.


