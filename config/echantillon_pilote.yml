version: "0.1"
status: phase5_composition_validee
updated_at: 2026-07-21

univers:
  source_id: inventaire_normandie_orne
  dossier_corpus: IA61000851
  nombre_dossiers_annonce: 319
  unite_de_selection: dossier_ia_candidat
  note: >-
    Un dossier IA est une porte d'entrée documentaire. Il ne devient un site
    canonique qu'après rapprochement et contrôle pendant l'enrichissement.

methode:
  type: echantillonnage_raisonne_par_quotas
  objectif: eprouver_le_modele_sur_la_diversite_du_corpus
  representativite_statistique: false
  taille_cible: 30
  quotas:
    zones_controle:
      minimum_distinct: 6
      minimum_par_zone: 5
    secteurs:
      minimum_distinct: 7
    periodes:
      minimum_distinct: 4
    conservation_source:
      minimum_distinct: 4
      valeurs_requises: [vestiges, disparu, inconnu]
    protection:
      minimum_proteges_mh_identifies: 5
      minimum_sans_protection_mh_identifiee: 10
    difficulte_localisation:
      minimum_difficiles: 5
      minimum_faciles_ou_intermediaires: 10

avertissements:
  - Les secteurs et périodes sont des profils de présélection à contrôler dans les notices.
  - La conservation provient de sources anciennes et ne décrit pas encore la situation actuelle.
  - L'absence de protection identifiée n'est pas une preuve juridique d'absence de protection.
  - La difficulté de localisation est une estimation de charge, pas un niveau de précision géographique.

