# Les douze systèmes industriels de la phase 10
#
# Le découpage est calculé : sont regroupés les sites distants de moins de trois
# kilomètres de proche en proche. Le calcul donne 88 groupes ; les douze plus
# gros rassemblent 172 des 318 sites et constituent le périmètre éditorial
# arrêté le 11 août 2026.
#
# Ce fichier n'est pas une configuration technique : il fixe l'identité
# éditoriale de chaque système. La taille seule ne suffit pas à les distinguer
# — quatre effectifs sont ex aequo — d'où l'ancrage par commune, qui rend
# l'identification déterministe et vérifiable.
#
# `nom` est le nom géographique, seul nom employé dans l'interface tant que la
# nomination éditoriale n'est pas validée. `nom_de_travail` est la proposition
# issue de la lecture du système ; elle reste une proposition et ne doit pas
# être affichée comme un titre acquis.

version: 1.0
date: 2026-08-13
seuil_regroupement_m: 3000
effectif_total_attendu: 172

systemes:
  - code: risle
    nom: Vallée de la Risle
    commune_ancrage: L'Aigle
    sites_attendus: 43
    nom_de_travail: la vallée du fil
