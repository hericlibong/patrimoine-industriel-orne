conservation:
  conserve:
    libelle: Conservé
    definition: Les éléments industriels structurants sont encore présents et lisibles.
  degrade:
    libelle: Dégradé
    definition: L'ensemble subsiste mais présente une dégradation matérielle importante.
  partiellement_conserve:
    libelle: Partiellement conservé
    definition: Une partie seulement des éléments industriels documentés subsiste.
  vestiges:
    libelle: Vestiges
    definition: Des traces matérielles limitées subsistent sans ensemble bâti complet.
  ruine:
    libelle: Ruine
    definition: Les structures subsistent principalement à l'état de ruine.
  disparu:
    libelle: Disparu
    definition: Aucun élément matériel industriel identifié ne subsiste à l'emplacement vérifié.
  inconnu:
    libelle: Conservation inconnue
    definition: Aucune observation suffisamment récente ne permet de conclure.

correspondances_conservation_sources:
  - {terme: bon état, conservation_code: conserve}
