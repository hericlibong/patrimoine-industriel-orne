precision_geographique:
  emprise_site_verifiee:
    libelle: Emprise du site vérifiée
    ordre: 10
    definition: Limites de l'ensemble industriel contrôlées à partir d'une source adaptée.
  parcelle_verifiee:
    libelle: Parcelle vérifiée
    ordre: 20
    definition: Parcelle cadastrale rattachée au site avec une correspondance contrôlée.
  batiment_verifie:
    libelle: Bâtiment vérifié
    ordre: 30
    definition: Bâtiment industriel identifié et contrôlé, sans emprise complète du site.
  point_site_verifie:
    libelle: Point du site vérifié
    ordre: 40
    definition: Point contrôlé sur le site, sans contour fiable disponible.
  point_adresse:
    libelle: Point issu d'une adresse
    ordre: 50
    definition: Point géocodé depuis une adresse suffisamment précise, sans validation du bâtiment.
  point_approximatif:
    libelle: Point approximatif
    ordre: 60
    definition: Point situant approximativement le site à l'intérieur d'une zone documentée.
  zone_documentaire:
    libelle: Zone documentaire
    ordre: 70
    definition: Zone ou emprise issue d'une source qui n'a pas encore été alignée sur le terrain actuel.

