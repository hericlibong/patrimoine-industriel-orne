# Les secteurs, activités, installations et énergies sont validés pour le
# premier bloc de la phase 4. Les classifications suivantes restent provisoires.
version: 0.2
status: phase4_bloc1_valide
updated_at: 2026-07-21

secteurs:
  extraction:
    libelle: Extraction
    definition: Extraction de minerai, pierre, argile ou autre ressource du sous-sol.
    ordre: 10
  metallurgie_travail_metaux:
    libelle: Métallurgie et travail des métaux
    definition: Production, transformation et façonnage des métaux.
    ordre: 20
  textile_habillement_cuir:
    libelle: Textile, habillement et cuir
    definition: Préparation des fibres, filature, tissage, confection et travail du cuir.
    ordre: 30
  bois_papier_imprimerie:
    libelle: Bois, papier et imprimerie
    definition: Sciage et transformation du bois, fabrication du papier et du carton, impression.
    ordre: 40
  verre_ceramique_materiaux_construction:
    libelle: Verre, céramique et matériaux de construction
    definition: Fabrication de verre, brique, tuile, céramique, chaux, ciment et produits proches.
    ordre: 50
  agroalimentaire:
    libelle: Agroalimentaire
    definition: Transformation productive des céréales, huiles, lait, boissons, viandes et aliments.
    ordre: 60
  energie:
    libelle: Production d'énergie
    definition: Production d'électricité, de gaz ou d'une autre énergie destinée à être distribuée.
    ordre: 70
  chimie_caoutchouc_plastiques:
    libelle: Chimie, caoutchouc et plastiques
    definition: Fabrication de produits chimiques, pharmaceutiques, en caoutchouc ou en plastique.
    ordre: 80
  mecanique_electrique:
    libelle: Construction mécanique et électrique
    definition: Fabrication de machines, équipements mécaniques ou matériels électriques.
    ordre: 90
  autres_industries:
    libelle: Autres industries
    definition: Activité industrielle confirmée ne relevant d'aucun secteur défini.
    ordre: 980
  inconnu:
    libelle: Secteur inconnu
    definition: L'activité industrielle est attestée mais son secteur ne peut pas encore être déterminé.
    ordre: 990

