  - {terme: vestiges, conservation_code: vestiges}
  - {terme: ruine, conservation_code: ruine}
  - {terme: détruit, conservation_code: disparu}

termes_hors_conservation:
  - {terme: établissement industriel désaffecté, nature: statut_activite}
  - {terme: désaffecté, nature: statut_activite}

usages_actuels:
  activite_industrielle:
    libelle: Activité industrielle
    definition: Une production industrielle est encore exercée sur le site.
  artisanat_production:
    libelle: Artisanat ou petite production
    definition: Une activité productive non industrielle occupe actuellement le site.
  culture_musee:
    libelle: Culture ou musée
    definition: Le site accueille un musée, une exposition ou une activité culturelle.
  tourisme_visite:
    libelle: Tourisme ou visite patrimoniale
    definition: Le site est exploité comme lieu de visite ou d'accueil touristique.
  logement:
    libelle: Logement
    definition: Tout ou partie du site est utilisé comme habitation.
  commerce_services:
    libelle: Commerce ou services
    definition: Le site accueille une activité commerciale ou de service.
  bureaux:
    libelle: Bureaux
    definition: Le site accueille principalement des fonctions administratives ou tertiaires.
  agriculture:
    libelle: Agriculture
    definition: Le site est réutilisé pour une activité agricole.
  stockage:
    libelle: Stockage
    definition: Les bâtiments ou terrains servent principalement au stockage.
  equipement_public:
    libelle: Équipement public
    definition: Le site accueille un service ou équipement public hors culture.
  vacant:
    libelle: Vacant
    definition: Les bâtiments sont inoccupés au moment de la vérification.
  sans_usage:
    libelle: Sans usage
    definition: Aucun usage fonctionnel n'est identifié, notamment pour un site sans bâti utilisable.
  autre:
    libelle: Autre usage
    definition: Un usage vérifié ne correspond à aucune catégorie définie.
  inconnu:
    libelle: Usage inconnu
    definition: L'usage actuel n'a pas pu être vérifié.

accessibilite:
  visitable:
    libelle: Visitable
    definition: Une visite du site est officiellement autorisée selon des modalités vérifiées.
  partiellement_visitable:
    libelle: Partiellement visitable
    definition: Seule une partie identifiée du site est officiellement accessible.
  visible_espace_public:
    libelle: Visible depuis l'espace public
    definition: Le site est observable sans entrer dans une propriété ou zone réglementée.
  prive_visible:
    libelle: Privé mais visible
    definition: Le site est privé, non visitable, mais visible depuis l'espace public.
  prive_non_visible:
    libelle: Privé et non visible
    definition: Le site est privé et ne peut pas être observé depuis l'espace public.
  inaccessible:
    libelle: Inaccessible
    definition: L'accès est matériellement impossible, interdit ou dangereux.
  inconnu:
    libelle: Accessibilité inconnue
    definition: Les conditions d'accès n'ont pas été vérifiées récemment.

