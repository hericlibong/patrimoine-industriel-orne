# Arbitrage humain des relations entre sites — mouvement 2
#
# Chaque décision est prise en relisant la phrase source. Une cible retenue sans
# que la phrase la nomme est marquée `cible_methode: interpretee` : le lien
# existe bien dans la source, mais l'identification du site visé est une
# décision éditoriale et non une lecture littérale.
#
# Voir docs/phase10_extraction_relations.md et docs/phase10_methodes.md.

version: 1
date_decision: 2026-07-29
auteur: revue humaine assistée

# ---------------------------------------------------------------------------
# Liens retenus tels quels. La phrase nomme la cible sans ambiguïté.
# ---------------------------------------------------------------------------
valides:
  - source: IA00060893
    cible: IA00061039
    type: fourniture
    fiabilite: forte
    note: tissus d'amiante produits à l'usine du Plafond
  - source: IA00060894
    cible: IA00060964
    type: approvisionnement
    fiabilite: forte
    note: réciproque de IA00060964 vers IA00060894
  - source: IA00060913
    cible: IA00060915
    type: approvisionnement
    fiabilite: forte
    note: filature de la Planchette nommée dans la phrase
  - source: IA00060947
    cible: IA00060946
    type: approvisionnement
    fiabilite: forte
    note: affinerie transférée à Cossé, confirmée par la notice de la cible
  - source: IA00060964
    cible: IA00060894
    type: approvisionnement
    fiabilite: forte
    note: réciproque de IA00060894 vers IA00060964
  - source: IA00061024
    cible: IA00061025
    type: approvisionnement
    fiabilite: forte
  - source: IA00061040
    cible: IA00061039
    type: fourniture
    fiabilite: forte
  - source: IA00061087
    cible: IA00060949
    type: approvisionnement
    fiabilite: forte
  - source: IA00061144
    cible: IA00061053
    type: fourniture
    fiabilite: forte
    note: livraison par voie ferrée particulière
  - source: IA00061145
    cible: IA00061053
    type: fourniture
    fiabilite: forte

# ---------------------------------------------------------------------------
# Liens complétés. La phrase cite plusieurs cibles, l'extraction n'en avait
# retenu qu'une.
# ---------------------------------------------------------------------------
completes:
  - source: IA00061093
    cibles: [IA00061094, IA00061158]
    type: approvisionnement
    fiabilite: forte
    note: >-
      « alimentait en gueuses les forges de Gaillon et de Randonnai ».
      Deux affineries distinctes sont nommées.
  - source: IA00061096
    cibles: [IA00061094, IA00061158]
    type: approvisionnement
    fiabilite: forte
    note: >-
      « alimentée en fer par les affineries de Gaillon et de Randonnai ».
      Avec le lien précédent, forme une chaîne à trois niveaux : haut fourneau
      d'Irai, deux affineries de Randonnai, fenderie de Conturbie.

# ---------------------------------------------------------------------------
# Liens ambigus tranchés après lecture.
# ---------------------------------------------------------------------------
arbitrages:
  - source: IA00060948
    cible: IA00061023
    type: approvisionnement
    direction: entrant
    cible_methode: sourcee
    fiabilite: forte
    motif: >-
      « alimentée en fer par la forge du champ de la pierre ». La commune ne
      compte que deux sites : la fenderie émettrice et l'usine de fabrication
      des métaux au lieu-dit La Forge, dont la notice atteste un haut fourneau
      et une affinerie dès 1572.
  - source: IA00061033
    cible: IA00061155
    type: transfert
    cible_methode: interpretee
    fiabilite: moyenne
    motif: >-
      « production transférée à l'usine de Saint-Sulpice-sur-Risle après 1945 ».
      La commune compte cinq sites. Le site émetteur a été racheté par Benjamin
      Bohin en 1887 ; l'usine réceptrice est donc les établissements Bohin, seul
      site encore en activité. La phrase ne le nomme pas.
  - source: IA00061113
    cible: IA00061155
    type: transfert
    cible_methode: interpretee
    fiabilite: moyenne
    motif: >-
      Même formulation. Site racheté par Bohin vers 1909 et spécialisé dans les
      crochets.
  - source: IA00061114
    cible: IA00061155
    type: transfert
    cible_methode: interpretee
    fiabilite: moyenne
    motif: >-
      Même formulation. Site racheté par Benjamin Bohin vers 1893.
  - source: IA00061112
    cible: IA00061153
    type: approvisionnement
    cible_methode: interpretee
    fiabilite: faible
    motif: >-
      « alimentaient en gueuses une affinerie, mentionnée en 1482 et peut-être
      déjà établie sur le site de Beaumont ». La source doute elle-même, et
      précise que les deux établissements émetteurs n'ont pu être localisés.
      Conservé au niveau de preuve le plus bas, avec la réserve visible.

# ---------------------------------------------------------------------------
# Liens ajoutés à la main, manqués par l'extraction.
# ---------------------------------------------------------------------------
ajouts:
  - source: IA00061188
    cible: IA00061187
    type: dependance
    cible_methode: sourcee
    fiabilite: forte
    motif: >-
      « fenderie attestée en 1608, dépendant de l'affinerie et du haut fourneau
      de Larchamp, propriété du baron de Larchamp ». Écartée par le filtre des
      dépendances seigneuriales, déclenché par « baron » dans la même phrase.
      La dépendance industrielle est pourtant explicite. Larchamp compte par
      ailleurs une mine de fer, ce qui complète la chaîne locale.

# ---------------------------------------------------------------------------
# Liens écartés.
# ---------------------------------------------------------------------------
ecartes:
  - source: IA00061086
    motif: >-
      « énergie électrique fournie par l'usine d'Avezé dans la Sarthe ». Avezé
      n'est pas dans l'Orne : la cible est hors corpus. La mention rejoint les
      liens vers l'extérieur.
