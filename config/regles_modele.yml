version: 1.3
status: modele_v1_valide
updated_at: 2026-07-21

identifiants:
  entites_metier:
    format: uuid_v4
    stockage: UUID
    generation: creation_unique
    regeneration_interdite: true
    reutilisation_interdite: true
  source_id:
    format: slug_stable
  externes:
    table: identifiants_externes
    contrainte_unique: [source_id, type_identifiant_code, valeur]
    jointure_automatique: correspondance_exacte_uniquement
  fusion_sites:
    suppression: false
    statut_ligne_source: fusionne
    redirection: site_id_canonique

relations:
  suppression_physique_metier: interdite
  suppression_cascade_metier: interdite
  mentions_sources:
    cible: [entite_type_code, entite_id, champ_cible]
    validation_transversale: obligatoire
  protections:
    cible_exactement_une: [site_id, objet_technique_id]
  relations_sites:
    auto_relation_interdite: true
    symetriques_ordre_uuid_canonique: true
  propositions_rapprochement:
    table: propositions_rapprochement
    fusion_automatique: interdite
    sites_distincts_avant_decision: true
    ordre_uuid_canonique: true
    decisions: [a_verifier, confirme_meme_site, rejete_sites_distincts]

champs_techniques_communs:
  obligatoires:
    - identifiant_interne
    - statut_enregistrement_code
    - cree_le
    - cree_par
    - modifie_le

champs_obligatoires:
  sites:
    toujours: [site_id, statut_corpus_code, decision_inclusion_code, fiabilite_code]
    si_inclus: [commune_orne, activite_admissible, mention_source]
    si_cartographiable: [geometrie_reference_qualifiee]
    si_publie: [nom_principal, decision_validee, source_affichable]
  activites:
    toujours: [activite_id, site_id, libelle_ou_code, fiabilite_code]
  etats_actuels:
    toujours: [etat_actuel_id, site_id, date_verification, methode_verification_code, fiabilite_code]
    au_moins_un: [conservation_code, usage_actuel_lie, accessibilite_code]
  usages_actuels:
    toujours: [usage_actuel_id, etat_actuel_id, usage_code]
    un_seul_principal_par_observation: true
    codes_exclusifs: [sans_usage, inconnu]
  sources:
    toujours: [source_id, titre, producteur, role_code, statut_audit_code]
  mentions_sources:
    toujours: [mention_id, source_id, cible, nature_information_code, statut_valeur_code, date_consultation]
  protections:
    toujours: [protection_id, cible_unique, type_protection_code, reference_protection, date_verification]
  objets_techniques:
    toujours: [objet_technique_id, nom_ou_denomination, fiabilite_code]
  geometries:
    toujours: [geometrie_id, site_id, geom, type_geometrie_code, precision_geographique_code, methode_localisation_code, fiabilite_code]
    precision_vocabulaire: precision_geographique
    centre_commune_interdit_comme_geometrie_site: true
  exploitants:
    toujours: [exploitant_id, nom_principal, type_exploitant_code]
  exploitations:
    toujours: [exploitation_id, site_id, exploitant_id, role_code, fiabilite_code]
  relations_sites:
    toujours: [relation_site_id, site_source_id, site_cible_id, type_relation_code, statut_validation_code, fiabilite_code]
  propositions_rapprochement:
    toujours: [proposition_rapprochement_id, site_a_id, site_b_id, methode_code, statut_decision_code, fiabilite_code]

valeurs_absentes:
  null: aucune_valeur_normalisee_stockee
  statuts:
    - renseignee
    - inconnue
    - non_renseignee_source
    - non_applicable
    - contradictoire
    - a_verifier
  substituts_interdits: [chaine_vide, N_A, NC, point_interrogation, tiret, date_zero, annee_9999, coordonnees_zero_zero]
  valeur_source_vide:
    valeur_normalisee: null
    statut: non_renseignee_source

dates_imprecises:
  champs: [min, max, precision_code, texte_source]
  milieu_intervalle_comme_date_reelle: interdit
  vers_annee_marge_ans: 5
  siecle:
    premiere_annee: 1
    derniere_annee: 100
  bornes_ouvertes:
    avant: min_null
    apres: max_null

periodes_calculees:
  methodes:
    chronologie_phase: dates_structurees_de_la_phase_activite
    siecles_source_site: reperage_depuis_scle_sans_preuve_de_continuite
    situation_actuelle_documentee: observation_contemporaine_avec_source_recente
  export_site:
    periodes_activite_et_source_separees: true
    union_autorisee_pour_filtrage: true
  export_activite:
    une_ligne_par_phase: true
    methode_obligatoire: true

activites_successives:
  changement_activite: nouvelle_phase
  interruption_documentee: nouvelle_phase
  activites_simultanees: phases_distinctes_chevauchantes
  changement_exploitant_seul: nouvelle_exploitation
  changement_energie_seul: nouvelle_periode_energie
  changement_emprise: nouveau_site_plus_relation
  transition_inconnue: intervalles_sans_date_inventee
  inclusion_avant_1950: au_moins_une_phase_admissible

observations_actuelles:
  mode: append_only
  identifiant_nouveau_a_chaque_observation: true
  version_croissante_par_site: true
  date_verification_exacte_obligatoire: true
  remplacement:
    champ: remplace_etat_actuel_id
    suppression_ancienne_ligne: false
    motifs: [nouvelle_observation, correction, annulation]
  vue_courante: etats_actuels_courants
  vue_usages_courants: usages_actuels_courants
  selection: derniere_valeur_non_annulee_par_dimension
  fraicheur_mois:
    accessibilite: 3
    usage_actuel: 12
    conservation: 12

qualite:
  fiabilite_codes: [forte, moyenne, faible]
  a_verifier_est_un_statut: true
  precision_methode_et_fiabilite_separees: true
  autre_et_inconnu: regles_dans_classifications
