    identifier: reference_PM
    audit_status: validee_avec_reserves
    data_license: licence_ouverte_2_0
    media_rights: verifier_auteur_et_ayant_droit_notice_par_notice
    attribution: Ministère de la Culture - POP / Palissy
    rights_url: https://pop.culture.gouv.fr/conditions-generales-utilisation
    limits:
      - export national d'environ 363 Mo
      - liens aux sites parfois indirects
      - export testé limité aux objets protégés

  - id: monuments_historiques_data_culture
    name: Immeubles protégés au titre des Monuments historiques
    producer: Ministère de la Culture
    priority: P1
    role: enrichissement
    url: https://data.culture.gouv.fr/explore/dataset/liste-des-immeubles-proteges-au-titre-des-monuments-historiques/
    access: [csv, geojson, api]
    identifier: reference_Merimee
    audit_status: validee
    data_license: licence_ouverte_2_0
    media_rights: hors_perimetre_du_jeu_de_donnees
    attribution: Ministère de la Culture - Monuments historiques
    rights_url: https://pop.culture.gouv.fr/donnees-ouvertes
    metrics_at_audit:
      orne_records: 420
      with_wgs84: 341
      industrial_keyword_candidates: 18
