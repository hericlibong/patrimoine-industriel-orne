    rights_url: https://apicarto.ign.fr/api/cadastre/parcelle
    limits:
      - ne prouve ni emprise historique ni propriété
      - une intersection avec un point source produit une parcelle candidate, pas une parcelle vérifiée

  - id: ban
    name: Base Adresse Nationale
    producer: État et partenaires
    priority: P1
