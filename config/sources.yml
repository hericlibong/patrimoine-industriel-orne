    attribution: IGN et millésime du produit utilisé
    rights_url: https://geoservices.ign.fr/
    limits:
      - produit, couche et millésime à enregistrer à chaque extraction

  - id: cadastre
    name: Parcellaire Express via API Carto
    producer: IGN / DGFiP
    priority: P1
