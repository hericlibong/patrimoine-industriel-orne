      - recense les protections juridiques et non tout le patrimoine industriel

  - id: casias
    name: CASIAS
    producer: Géorisques / DREAL Normandie
    priority: P1
    role: elargissement
    url: https://www.data.gouv.fr/datasets/carte-des-anciens-sites-industriels-et-activites-de-services-casias-normandie
    access: [csv_national, fiches, shapefile, wfs]
    identifier: code_inventaire_ou_SSP_BASIAS
    audit_status: validee_avec_reserves
    data_license: licence_ouverte_2_0
    media_rights: hors_perimetre_du_jeu_de_donnees
    attribution: DREAL Normandie - CASIAS
    rights_url: https://www.data.gouv.fr/datasets/carte-des-anciens-sites-industriels-et-activites-de-services-casias-normandie
    metrics_at_audit:
      orne_wfs_records: 2052
      with_xy_wgs84: 209
      declared_not_geolocated: 1853
    limits:
      - ne prouve ni pollution ni valeur patrimoniale
      - géométrie WFS potentiellement communale pour les sites non géolocalisés
      - champ d'activité vide dans la couche WFS testée
      - fort bruit hors patrimoine

